<style>
/* Layout: one full-bleed canvas (night snow yard) with a thin floating HUD on top and bottom; menus are frosted cards over the board. */
:root{
  --night:#0b1424; --snow:#dfe8f5; --ink:#eef3fb; --muted:#9fb0c9;
  --warm:#ffc766; --frost:#8fd8ff; --panel:rgba(14,24,42,.78); --line:rgba(220,235,255,.12);
  --bad:#ffb4a8; --good:#b9f5c8;
  --display:'Fraunces',Georgia,'Times New Roman',serif; --ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--ui);-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.pill{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:box-shadow .3s,transform .3s;min-width:0}
.pill .dot{width:22px;height:22px;border-radius:50%;flex:none}
.pill.you .dot{background:radial-gradient(circle at 35% 35%,#fff6d8,#ffc766 45%,#d7871f)}
.pill.ai .dot{background:radial-gradient(circle at 35% 35%,#f2fbff,#8fd8ff 45%,#3a87c4)}
.pill .who{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.pill .num{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.pill.you.active{box-shadow:0 0 0 1.5px var(--warm),0 0 22px rgba(255,199,102,.35);transform:translateY(1px)}
.pill.ai.active{box-shadow:0 0 0 1.5px var(--frost),0 0 22px rgba(143,216,255,.3);transform:translateY(1px)}
.pill .gifts{font-size:12px;color:var(--muted);font-weight:700}
#mid{text-align:center;min-width:0;flex:1;padding-top:2px}
#lvlName{font-family:var(--display);font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#timer{margin:6px auto 0;width:min(160px,100%);height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
#timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff9b4a,#ffd98a);border-radius:6px;transition:width .1s linear}
#clock{font-size:13px;color:var(--muted);font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
#bar{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
#bar button,.ghost{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#hint{flex:1;text-align:center;font-size:14px;color:var(--muted);min-width:0;text-shadow:0 1px 8px rgba(0,0,0,.8);transition:opacity .4s}
.right{display:flex;gap:8px}
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 40%,rgba(10,18,34,.35),rgba(6,10,20,.82));overflow:auto}
.card{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px 24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,10vw,64px);margin:0;line-height:1;text-wrap:balance;letter-spacing:-.01em;background:linear-gradient(180deg,#fff7df,#ffc766 70%,#e59a3a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,190,90,.35))}
h2{font-family:var(--display);font-weight:700;font-size:30px;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
p{margin:0;line-height:1.55;color:#d6e0ee;font-size:15px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:16px;background:linear-gradient(180deg,#ffd58a,#f0a640);color:#2a1700;box-shadow:0 8px 24px rgba(240,166,64,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.sec{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row>.btn{flex:1 1 140px}
.seg{display:inline-flex;background:rgba(255,255,255,.06);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--ink)}
.tabs{display:flex;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.lv{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.lv b{font-family:var(--display);font-size:22px}
.lv small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lv .st{font-size:13px;letter-spacing:2px;color:#556a88}
.lv .st .on{color:var(--warm)}
.lv:disabled{opacity:.35;cursor:not-allowed}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.07);color:#cfe0f5}
.stars{font-size:38px;letter-spacing:8px;color:#3b4d68}
.stars .on{color:var(--warm);text-shadow:0 0 18px rgba(255,199,102,.7)}
.crit{font-size:13px;color:var(--muted);display:grid;gap:4px}
.crit .ok{color:var(--good)}
.small{font-size:13px;color:var(--muted)}
@media (max-width:560px){#bar{flex-wrap:wrap;justify-content:center}#hint{order:-1;flex-basis:100%}#bar button{padding:7px 11px;font-size:12px}.right{gap:6px}}
body.glass #hint{color:#eef2f7;text-shadow:0 1px 3px rgba(0,0,0,.6);font-weight:800}

/* ---------- journey (main mode) ---------- */
.btn.big{font-size:22px;padding:18px 22px;border-radius:18px;font-family:var(--display);letter-spacing:.02em}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-weight:700;font-size:13px;padding:4px 8px}
.settings{color:var(--muted);font-size:13px}.settings summary{cursor:pointer;font-weight:800;list-style:none}.settings summary::-webkit-details-marker{display:none}
#jhud{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
.jbox{background:linear-gradient(180deg,rgba(30,44,72,.94),rgba(14,22,40,.94));border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:5px 14px 7px;min-width:76px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.jbox .lab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:900}
.jbox .big{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;color:#fff4d6;display:inline-block}
#jCordsWrap.low .big{color:#ff8a7a;animation:jpulse .9s infinite}
@keyframes jpulse{50%{transform:scale(1.15)}}
#jScoreWrap.bump .big{animation:jbump .22s}
@keyframes jbump{40%{transform:scale(1.16);color:#fff}}
.jmeter{position:relative;height:7px;border-radius:7px;background:rgba(255,255,255,.12);margin:5px 4px 2px;width:118px}
.jmeter i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#ff9b4a,#ffd98a);box-shadow:0 0 10px rgba(255,190,90,.6)}
.jmeter b{position:absolute;top:50%;transform:translate(-50%,-52%);font-size:15px;color:#56647e;text-shadow:0 1px 2px #000;transition:color .2s,transform .2s}
.jmeter b.on{color:#ffd56a;transform:translate(-50%,-52%) scale(1.3)}
.jmid{flex:1;text-align:center;min-width:0;padding-top:2px}
#jName{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e9f0fb;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#jGoals{display:flex;justify-content:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.goal{display:inline-flex;align-items:center;gap:4px;background:rgba(10,16,30,.78);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:2px 10px 2px 3px}
.goal svg{width:26px;height:26px}.goal b{font-family:var(--display);font-size:18px;color:#fff4d6}
.goal.done{border-color:rgba(160,255,190,.6)}.goal.done b{color:#b9f5c8}
#sMap{place-items:start center;background:linear-gradient(180deg,rgba(6,10,20,.6),rgba(6,10,20,.9))}
.mapwrap{width:min(460px,100%);padding-bottom:60px}
.maptop{position:sticky;top:-24px;display:flex;justify-content:space-between;align-items:center;padding:30px 0 12px;z-index:3;background:linear-gradient(180deg,rgba(8,12,24,.95) 70%,rgba(8,12,24,0))}
.ghost{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px}
.mstats{display:flex;gap:8px}.mstats span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px;color:#ffe3a8}
.chap{margin:8px 0 26px;border-radius:26px;padding:18px 12px 10px;border:1px solid rgba(255,255,255,.08)}
.chap-snow{background:linear-gradient(180deg,rgba(230,240,255,.12),rgba(230,240,255,.02))}
.chap-glass{background:linear-gradient(180deg,rgba(255,190,110,.14),rgba(255,190,110,.02))}
.chap-ice{background:linear-gradient(180deg,rgba(120,200,255,.16),rgba(120,200,255,.02))}
.chead{text-align:center;margin-bottom:10px}.chead h3{font-family:var(--display);font-size:26px;margin:2px 0 0}
.nodes{position:relative}
.nodes svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.nodes svg.path path{fill:none;stroke:rgba(255,230,180,.4);stroke-width:4;stroke-dasharray:1 10;stroke-linecap:round;vector-effect:non-scaling-stroke}
.node{position:absolute;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;border:3px solid #15101c;background:radial-gradient(circle at 35% 30%,#fff6d8,#ffc766 45%,#d7871f);box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 -5px 0 rgba(0,0,0,.18);display:grid;place-items:center;padding:0}
.node .n{font-family:var(--display);font-weight:700;font-size:26px;color:#3a1d00}
.node .nst{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:15px;letter-spacing:1px}
.node .nst i{font-style:normal;color:rgba(255,255,255,.22)}.node .nst i.on{color:#ffd56a;text-shadow:0 0 8px rgba(255,200,90,.7)}
.node.done{background:radial-gradient(circle at 35% 30%,#f0fff4,#8ee6aa 45%,#2f9a5a)}.node.done .n{color:#0c3a1e}
.node.locked{background:radial-gradient(circle at 35% 30%,#8a96ab,#4a556b);opacity:.6;cursor:not-allowed}.node.locked .n{color:#1c2433}
.node.current{animation:nodepulse 1.4s infinite;z-index:2}
.node.current::after{content:'PLAY';position:absolute;top:-28px;font-size:11px;font-weight:900;letter-spacing:.12em;background:#ffd56a;color:#3a1d00;border-radius:999px;padding:3px 9px;border:2px solid #15101c}
@keyframes nodepulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,110,.7),0 8px 20px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 16px rgba(255,214,110,0),0 8px 20px rgba(0,0,0,.45)}}
.jcard{gap:14px}
.quip{font-style:italic;color:#ffe3b0;font-size:16px}
.jgoals{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.jg{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:16px;padding:8px 14px 8px 8px;text-align:left}
.jg svg{width:42px;height:42px}.jg b{display:block;font-family:var(--display);font-size:24px;line-height:1}.jg span{font-size:12px;color:var(--muted);font-weight:800}
.jg.done b{color:#b9f5c8}
#jiCords{font-weight:800;color:var(--muted)}#jiCords b{font-family:var(--display);font-size:30px;color:#fff4d6;margin-right:4px}
.bigstars{display:flex;justify-content:center;gap:10px;height:76px;align-items:flex-end}
.bigstars i{width:58px;height:58px;background:currentColor;color:#2e3a52;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transform:scale(.75);transition:transform .3s cubic-bezier(.3,1.9,.5,1),color .15s}
.bigstars i:nth-child(2){width:74px;height:74px}
.bigstars i.on{color:#ffd56a;transform:scale(1.08);filter:drop-shadow(0 0 14px rgba(255,200,90,.9))}
.bigstars i.off{transform:scale(.8)}
.jrscore{font-family:var(--display);font-size:40px;font-weight:700;color:#fff4d6;font-variant-numeric:tabular-nums;line-height:1}
.jcard.fail h2{color:#ffb4a8}
.left{font-weight:800;color:var(--muted);width:100%;font-size:13px}
.cocoa-chip{background:rgba(0,0,0,.18);border-radius:999px;padding:2px 8px;margin-left:6px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:560px){.jbox{min-width:62px;padding:4px 9px 6px}.jbox .big{font-size:24px}.jmeter{width:84px}#jName{font-size:13px}.goal svg{width:22px;height:22px}.goal b{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="studio-kit-css">/* studio-kit/kit.css v4 "Xmas Lights", inlined at merge (artifact CSP allows no external stylesheets) */
/* =====================================================================
   XMAS LIGHTS  ·  kit.css v3 "Night Glow"  (team 2: UI)
   Clean 2026 casual-game look: dark winter-night indigo, chunky glossy
   soft-3D buttons and tiles, violet panels with a light rim, gold reward
   accents, one rounded type family. Few elements, big and readable.
   Class names are the same as v2, so markup already merged keeps working.

   Fonts:
   
   ===================================================================== */
:root{
  --nl-ink:#2a1640; --nl-ink-soft:#5b4a80;
  --nl-night:#140b33; --nl-night-2:#1f1452; --nl-night-3:#2a1a63;
  --nl-panel-1:#5a3dd0; --nl-panel-2:#3a24a0; --nl-panel-3:#2a1878; --nl-panel-rim:#8f73ff; --nl-panel-edge:#1a0e52;
  --nl-well:#21145e; --nl-well-2:#170d47;
  --nl-text:#ffffff; --nl-text-soft:#c9bdff;
  --nl-red:#ff3b4e; --nl-red-dk:#c4142c; --nl-red-lt:#ff7a86; --nl-red-edge:#7a0a1c;
  --nl-green:#3ad66e; --nl-green-dk:#16a04a; --nl-green-lt:#8cf5a8; --nl-green-edge:#0a5a2a;
  --nl-gold:#ffc21a; --nl-gold-dk:#f08a00; --nl-gold-lt:#fff0a0; --nl-gold-edge:#8a4a00;
  --nl-blue:#3d9bff; --nl-blue-dk:#1f62e0; --nl-blue-lt:#9fd2ff; --nl-blue-edge:#0f2f8a;
  --nl-display:'Fredoka','Baloo 2',system-ui,sans-serif;
  --nl-ui:'Fredoka','Baloo 2',system-ui,sans-serif;
  --nl-hand:'Fredoka','Baloo 2',system-ui,sans-serif;
  --nl-r:26px; --nl-u:66px;
  --nl-spring:cubic-bezier(.34,1.56,.64,1);
}

/* ---------- type -----------------------------------------------------
   <span class="nl-display gold" data-text="PERFECT!">PERFECT!</span>
   chunky rounded letters, thick dark stroke, a 3D drop */
.nl-display{ --fill:#fff; --edge:#2a1260; position:relative; display:inline-block; font-family:var(--nl-display); font-weight:700; line-height:1.02; letter-spacing:.01em;
  color:var(--edge); -webkit-text-stroke:.18em var(--edge); paint-order:stroke fill; text-shadow:0 .09em 0 var(--edge), 0 .16em .2em rgba(0,0,0,.4); }
.nl-display::after{ content:attr(data-text); position:absolute; left:0; top:0; right:0; color:var(--fill); -webkit-text-stroke:0; text-shadow:none;
  background:var(--g,none); -webkit-background-clip:text; background-clip:text; }
.nl-display.gold{ --fill:transparent; --edge:#8a3a00; --g:linear-gradient(180deg,#fffbe0 0%,#ffe45a 38%,#ffb000 66%,#ff7a00 100%); }
.nl-display.red{ --fill:transparent; --edge:#6a0618; --g:linear-gradient(180deg,#ffe0e4 0%,#ff8090 40%,#ff3b4e 70%,#c4142c 100%); }
.nl-display.green{ --fill:transparent; --edge:#0a4a22; --g:linear-gradient(180deg,#eaffef 0%,#8cf5a8 40%,#3ad66e 72%,#16a04a 100%); }
.nl-display.white{ --fill:#fff; }
.nl-hand{ font-family:var(--nl-ui); font-weight:500; font-size:18px; line-height:1.25; color:var(--nl-text-soft); }
.nl-body{ font-family:var(--nl-ui); font-weight:600; color:var(--nl-text); font-size:16px; line-height:1.35; }
.nl-caps{ font-family:var(--nl-ui); font-weight:700; text-transform:uppercase; letter-spacing:.1em; font-size:12px; color:var(--nl-text-soft); }
.nl-num{ font-family:var(--nl-ui); font-weight:700; color:var(--nl-text); font-variant-numeric:tabular-nums; }

/* ---------- buttons: chunky soft-3D pills ---------------------------- */
.nl-btn{ --c1:var(--nl-green-lt); --c2:var(--nl-green); --c3:var(--nl-green-dk); --e:var(--nl-green-edge);
  position:relative; display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:60px; padding:0 34px 4px;
  font-family:var(--nl-display); font-weight:700; font-size:26px; letter-spacing:.01em; color:#fff; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
  border:0; border-radius:20px;
  background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 45%,var(--c3) 100%);
  box-shadow:0 6px 0 var(--e), 0 12px 18px rgba(0,0,0,.35), inset 0 -4px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.6), inset 0 0 0 2px rgba(255,255,255,.18);
  text-shadow:0 2px 0 rgba(0,0,0,.25);
  transition:transform .08s, box-shadow .08s, filter .15s; }
.nl-btn::before{ content:''; position:absolute; left:10px; right:10px; top:5px; height:38%; border-radius:14px; background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0)); pointer-events:none; }
.nl-btn::after{ content:''; position:absolute; inset:0; border-radius:20px; pointer-events:none; background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 60%) no-repeat; background-size:260% 100%; background-position:160% 0; }
.nl-btn.shine::after{ animation:nl-sweep 2.8s ease-in-out infinite 1s; }
.nl-btn:hover{ filter:brightness(1.06); }
.nl-btn:active,.nl-btn.pressed{ transform:translateY(5px); box-shadow:0 1px 0 var(--e), 0 4px 8px rgba(0,0,0,.3), inset 0 -3px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.6); }
.nl-btn.green{ }
.nl-btn.red{ --c1:var(--nl-red-lt); --c2:var(--nl-red); --c3:var(--nl-red-dk); --e:var(--nl-red-edge); }
.nl-btn.gold{ --c1:var(--nl-gold-lt); --c2:var(--nl-gold); --c3:var(--nl-gold-dk); --e:var(--nl-gold-edge); text-shadow:0 2px 0 rgba(140,60,0,.45); }
.nl-btn.blue{ --c1:var(--nl-blue-lt); --c2:var(--nl-blue); --c3:var(--nl-blue-dk); --e:var(--nl-blue-edge); }
.nl-btn.cream{ --c1:#8f78ff; --c2:#6a4ff0; --c3:#4a30c8; --e:#24127a; }
.nl-btn.sm{ min-height:46px; font-size:20px; padding:0 22px 3px; border-radius:16px; box-shadow:0 5px 0 var(--e), 0 8px 12px rgba(0,0,0,.3), inset 0 -3px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.6); }
.nl-btn.sm::after{ border-radius:16px; }
.nl-btn.wide{ width:100%; }
.nl-btn .nl-btn-ico{ width:34px; height:34px; margin-left:-8px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
.nl-btn .nl-btn-tag{ position:absolute; right:-10px; top:-14px; font-family:var(--nl-ui); font-weight:700; font-size:13px; background:var(--nl-red); color:#fff; border-radius:10px; padding:2px 8px; text-shadow:none; transform:rotate(8deg); box-shadow:0 3px 0 var(--nl-red-edge); }

/* square icon buttons (like a game HUD) */
.nl-round{ --c1:#7d63ff; --c2:#5a3df0; --c3:#3e24c4; --e:#1d0f6e;
  position:relative; width:52px; height:52px; border-radius:16px; display:inline-grid; place-items:center; cursor:pointer; color:#fff;
  background:linear-gradient(180deg,var(--c1),var(--c2) 50%,var(--c3));
  box-shadow:0 5px 0 var(--e), 0 8px 12px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.45), inset 0 0 0 2px rgba(255,255,255,.12); transition:transform .08s; }
.nl-round::before{ content:''; position:absolute; left:6px; right:6px; top:4px; height:38%; border-radius:11px; background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0)); pointer-events:none; }
.nl-round:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--e); }
.nl-round svg{ width:26px; height:26px; position:relative; filter:drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
.nl-round.cream{ width:44px; height:44px; border-radius:14px; }
.nl-round.cream svg{ width:22px; height:22px; }
.nl-round.green{ --c1:var(--nl-green-lt); --c2:var(--nl-green); --c3:var(--nl-green-dk); --e:var(--nl-green-edge); }
.nl-round.gold{ --c1:var(--nl-gold-lt); --c2:var(--nl-gold); --c3:var(--nl-gold-dk); --e:var(--nl-gold-edge); }
.nl-round.red{ --c1:var(--nl-red-lt); --c2:var(--nl-red); --c3:var(--nl-red-dk); --e:var(--nl-red-edge); border-radius:50%; }
.nl-round .nl-badge{ position:absolute; right:-8px; bottom:-8px; }
.nl-badge{ min-width:24px; height:24px; padding:0 6px; border-radius:12px; display:inline-grid; place-items:center; font-family:var(--nl-ui); font-weight:700; font-size:14px; color:#fff; background:var(--nl-red); box-shadow:0 2px 0 var(--nl-red-edge), 0 0 0 2px #fff; }
/* HUD text pill ("MENU", level label) */
.nl-pill-btn{ display:inline-flex; align-items:center; height:40px; padding:0 16px 1px; border-radius:14px; font-family:var(--nl-display); font-weight:700; font-size:17px; color:#fff; letter-spacing:.04em; cursor:pointer;
  background:rgba(20,10,60,.55); box-shadow:inset 0 0 0 2px rgba(160,140,255,.45), 0 4px 10px rgba(0,0,0,.25); backdrop-filter:blur(6px); }

.nl-toggle{ position:relative; width:64px; height:36px; border-radius:18px; background:#1a0f4a; box-shadow:inset 0 2px 4px rgba(0,0,0,.4), inset 0 0 0 2px rgba(160,140,255,.35); cursor:pointer; transition:background .2s; }
.nl-toggle::after{ content:''; position:absolute; top:4px; left:4px; width:28px; height:28px; border-radius:50%; background:linear-gradient(180deg,#fff,#d6d0f5); box-shadow:0 2px 4px rgba(0,0,0,.35); transition:transform .25s var(--nl-spring); }
.nl-toggle.on{ background:linear-gradient(180deg,var(--nl-green),var(--nl-green-dk)); }
.nl-toggle.on::after{ transform:translateX(28px); }

/* ---------- reward backdrop: night fireworks burst ------------------- */
.nl-sunburst{ position:absolute; inset:0; overflow:hidden; background:radial-gradient(circle at 50% 36%,#5a3ad8 0%,#2a1872 40%,#120a34 80%); }
.nl-sunburst::before{ content:''; position:absolute; left:50%; top:36%; width:260%; aspect-ratio:1; transform:translate(-50%,-50%); background:repeating-conic-gradient(rgba(190,170,255,.12) 0 8deg,transparent 8deg 18deg); animation:nl-spin 40s linear infinite; will-change:transform;
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 55%); mask:radial-gradient(circle,#000 10%,transparent 55%); }
.nl-sunburst::after{ content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 36%,rgba(255,210,90,.35),transparent 35%); }

/* ---------- panels --------------------------------------------------- */
.nl-scrim{ position:absolute; inset:0; background:radial-gradient(ellipse at 50% 40%,rgba(60,30,140,.35),rgba(8,4,24,.82)); backdrop-filter:blur(5px); display:grid; place-items:center; padding:16px; z-index:50; }
.nl-card{ position:relative; width:min(330px,100%); padding:44px 20px 22px; border-radius:var(--nl-r); text-align:center; color:var(--nl-text);
  background:linear-gradient(180deg,var(--nl-panel-1) 0%,var(--nl-panel-2) 45%,var(--nl-panel-3) 100%);
  box-shadow:inset 0 0 0 3px var(--nl-panel-rim), inset 0 3px 0 4px rgba(255,255,255,.12), 0 0 0 4px var(--nl-panel-edge), 0 10px 0 4px var(--nl-panel-edge), 0 24px 50px rgba(0,0,0,.55); }
.nl-card > *{ position:relative; z-index:1; }
.nl-card .nl-close{ position:absolute; right:12px; top:12px; z-index:3; width:40px; height:40px; } /* v3.1: inside the card, never off-screen */
.nl-card.plain{ }
.nl-card.gold{ box-shadow:inset 0 0 0 3px #ffe27a, inset 0 3px 0 4px rgba(255,255,255,.15), 0 0 0 5px #c47a00, 0 10px 0 5px #7a4500, 0 24px 50px rgba(0,0,0,.55); }

/* header tab on top of a card */
.nl-ribbon{ position:absolute !important; left:50%; top:-24px; transform:translateX(-50%); z-index:4 !important; white-space:nowrap; }
.nl-ribbon span{ position:relative; display:block; padding:6px 28px 9px; font-family:var(--nl-display); font-weight:700; font-size:24px; color:#fff; border-radius:16px;
  background:linear-gradient(180deg,#8f73ff,#5a3df0 55%,#4228d0); box-shadow:inset 0 2px 0 rgba(255,255,255,.4), inset 0 0 0 2px rgba(255,255,255,.15), 0 0 0 4px var(--nl-panel-edge), 0 6px 0 4px var(--nl-panel-edge); text-shadow:0 2px 0 rgba(0,0,0,.3); }
.nl-ribbon.red span{ background:linear-gradient(180deg,var(--nl-red-lt),var(--nl-red) 55%,var(--nl-red-dk)); box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 0 0 4px var(--nl-red-edge), 0 6px 0 4px var(--nl-red-edge); }
.nl-ribbon.green span{ background:linear-gradient(180deg,var(--nl-green-lt),var(--nl-green) 55%,var(--nl-green-dk)); box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 0 0 4px var(--nl-green-edge), 0 6px 0 4px var(--nl-green-edge); }
.nl-ribbon span img{ height:22px; width:auto; vertical-align:-3px; margin:0 2px 0 6px; }
.nl-ribbon.inline{ position:relative !important; left:auto; top:auto; transform:none; display:inline-block; }
.nl-ribbon.big span{ font-size:30px; padding:8px 36px 12px; }
.nl-ribbon.big span small{ display:block; font-family:var(--nl-ui); font-weight:600; font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.85; margin-bottom:-2px; }

.nl-well{ background:linear-gradient(180deg,var(--nl-well-2),var(--nl-well)); box-shadow:inset 0 3px 6px rgba(0,0,0,.35), inset 0 0 0 2px rgba(140,120,255,.2); border-radius:18px; padding:10px 12px; }
.nl-quip{ font-family:var(--nl-ui); font-weight:500; font-size:17px; line-height:1.3; color:var(--nl-text-soft); margin:6px 8px 14px; }
.nl-leader{ display:flex; align-items:center; gap:8px; font-family:var(--nl-ui); font-weight:600; font-size:17px; color:var(--nl-text-soft); padding:4px 0; }
.nl-leader::before{ content:''; order:2; flex:1; border-bottom:2px dotted rgba(200,190,255,.3); }
.nl-leader b{ order:3; font-weight:700; color:#fff; }

/* reward pedestal / medallion: an object on a glowing disc */
.nl-medal{ position:relative; width:150px; height:150px; margin:0 auto; border-radius:50%; display:grid; place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(255,230,140,.45),rgba(255,180,60,.12) 50%,transparent 70%); }
.nl-medal::before{ content:''; position:absolute; inset:-20px; border-radius:50%; background:repeating-conic-gradient(rgba(255,230,150,.35) 0 6deg,transparent 6deg 16deg); -webkit-mask:radial-gradient(circle,#000 20%,transparent 68%); mask:radial-gradient(circle,#000 20%,transparent 68%); animation:nl-spin 18s linear infinite; z-index:-1; }
.nl-medal::after{ content:''; position:absolute; left:16%; right:16%; bottom:2%; height:22%; border-radius:50%; background:radial-gradient(ellipse,#6a4ff0,#2a1878 70%); box-shadow:inset 0 3px 0 rgba(255,255,255,.25), 0 6px 12px rgba(0,0,0,.4); z-index:-1; }
.nl-medal canvas,.nl-medal img{ width:120px; height:120px; }

.nl-in{ animation:nl-in .5s var(--nl-spring) both; }
.nl-out{ animation:nl-out .25s ease-in both; }
.nl-in .nl-stagger > *{ animation:nl-rise .45s var(--nl-spring) both; }
.nl-in .nl-stagger > *:nth-child(1){animation-delay:.1s} .nl-in .nl-stagger > *:nth-child(2){animation-delay:.16s} .nl-in .nl-stagger > *:nth-child(3){animation-delay:.22s} .nl-in .nl-stagger > *:nth-child(4){animation-delay:.28s} .nl-in .nl-stagger > *:nth-child(5){animation-delay:.34s} .nl-in .nl-stagger > *:nth-child(6){animation-delay:.4s}

/* ---------- glossy stars --------------------------------------------- */
.nl-stars{ display:flex; justify-content:center; align-items:flex-end; gap:6px; margin:-4px 0 6px; }
.nl-star{ width:76px; height:76px; position:relative; }
.nl-star:nth-child(2){ width:96px; height:96px; margin-bottom:14px; }
.nl-star::before,.nl-star::after{ content:''; position:absolute; inset:0; background-size:contain; background-repeat:no-repeat; }
.nl-star::before{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 8 C53 8 55 10 56.5 13 L64 30 L83 32.5 C90 33.5 92 40 87 44.5 L73 58 L77 77 C78.5 84 72.5 88 66.5 84.5 L50 75 L33.5 84.5 C27.5 88 21.5 84 23 77 L27 58 L13 44.5 C8 40 10 33.5 17 32.5 L36 30 L43.5 13 C45 10 47 8 50 8Z' fill='%23150b40' stroke='%236a55c0' stroke-width='3'/></svg>"); }
.nl-star::after{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='42%' cy='35%' r='70%'><stop offset='0' stop-color='%23fffbe0'/><stop offset='.45' stop-color='%23ffd84a'/><stop offset='1' stop-color='%23f08a00'/></radialGradient></defs><path d='M50 8 C53 8 55 10 56.5 13 L64 30 L83 32.5 C90 33.5 92 40 87 44.5 L73 58 L77 77 C78.5 84 72.5 88 66.5 84.5 L50 75 L33.5 84.5 C27.5 88 21.5 84 23 77 L27 58 L13 44.5 C8 40 10 33.5 17 32.5 L36 30 L43.5 13 C45 10 47 8 50 8Z' fill='url(%23g)'/><path d='M50 18 L56 33 L50 46 L44 33Z' fill='white' opacity='.55'/><ellipse cx='38' cy='35' rx='7' ry='4' transform='rotate(-30 38 35)' fill='white' opacity='.85'/></svg>");
  transform:scale(0); opacity:0; filter:drop-shadow(0 0 10px rgba(255,200,60,.6)); }
.nl-star.on::after{ transform:scale(1); opacity:1; }
.nl-star.slam::after{ animation:nl-slam .5s cubic-bezier(.2,1.6,.4,1) both; }
.nl-stars.sm .nl-star{ width:18px; height:18px; } .nl-stars.sm .nl-star:nth-child(2){ width:22px; height:22px; margin-bottom:3px; }
.nl-stars.sm .nl-star::after{ filter:none; }
.nl-stars.hud{ gap:2px; margin:0; } .nl-stars.hud .nl-star,.nl-stars.hud .nl-star:nth-child(2){ width:28px; height:28px; margin:0; }

/* ---------- goals ------------------------------------------------------ */
.nl-goals{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
.nl-goal{ position:relative; width:72px; height:78px; border-radius:18px; display:grid; place-items:center; background:linear-gradient(180deg,#3a259a,#24166a); box-shadow:inset 0 0 0 2px rgba(150,130,255,.35), inset 0 2px 0 rgba(255,255,255,.12); }
.nl-goal img{ width:50px; height:50px; object-fit:contain; margin-top:-12px; filter:drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
.nl-goal .nl-goal-n{ position:absolute; bottom:3px; left:50%; transform:translateX(-50%); font-family:var(--nl-ui); font-weight:700; font-size:18px; color:#fff; }
.nl-goal.done{ background:linear-gradient(180deg,#1f8a4a,#12603a); box-shadow:inset 0 0 0 2px #5cf08f; }
.nl-goal.done::after{ content:''; position:absolute; right:-8px; top:-8px; width:26px; height:26px; border-radius:50%; background:var(--nl-green) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5 L10 17 L19 7' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/70% no-repeat; box-shadow:0 2px 0 var(--nl-green-edge), 0 0 0 2px #fff; animation:nl-slam .45s var(--nl-spring) both; }
.nl-goal.miss{ box-shadow:inset 0 0 0 3px var(--nl-red), 0 0 16px rgba(255,59,78,.5); animation:nl-throb 1s ease-in-out infinite; }
.nl-meta{ display:flex; justify-content:center; gap:10px; margin:14px 0 16px; flex-wrap:wrap; }
.nl-pill{ display:inline-flex; align-items:center; gap:6px; padding:3px 14px 4px 6px; border-radius:16px; background:rgba(20,10,60,.55); box-shadow:inset 0 0 0 2px rgba(160,140,255,.4); font-family:var(--nl-ui); font-weight:700; font-size:17px; color:#fff; }
.nl-pill img{ width:28px; height:28px; }

/* ---------- HUD: minimal, out of the way ----------------------------- */
.nl-hud{ position:absolute; left:0; right:0; top:0; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 12px 0; z-index:20; pointer-events:none; }
.nl-hud > *{ pointer-events:auto; }
.nl-hud-left,.nl-hud-right{ display:flex; align-items:center; gap:8px; }
.nl-scorechip{ position:relative; display:flex; align-items:center; gap:6px; padding:2px 14px 2px 4px; height:44px; border-radius:16px; background:linear-gradient(180deg,#2a1a7a,#1a0f52); box-shadow:inset 0 0 0 2px rgba(160,140,255,.5), 0 4px 0 #0e0738, 0 8px 14px rgba(0,0,0,.3); }
.nl-jar{ position:relative; width:40px; height:44px; margin:-8px 0 -4px -4px; }
.nl-jar img{ position:absolute; inset:0; width:100%; height:100%; z-index:2; }
.nl-jar .nl-jar-glow{ position:absolute; left:8px; right:8px; bottom:4px; height:calc(var(--fill,0) * 26px + 3px); border-radius:4px 4px 12px 12px; z-index:1; background:radial-gradient(circle at 50% 30%,#fffbd0,#ffd23f 45%,#ff9a12); box-shadow:0 0 16px 6px rgba(255,200,60,.7); transition:height .3s var(--nl-spring); }
.nl-jar.gulp{ animation:nl-gulp .32s var(--nl-spring); }
.nl-score{ font-family:var(--nl-ui); font-weight:700; font-size:21px; line-height:1; color:#fff; font-variant-numeric:tabular-nums; min-width:60px; }
.nl-score.tick{ animation:nl-tick .22s ease-out; }
.nl-meter{ position:relative; height:12px; border-radius:8px; background:#0c0630; box-shadow:inset 0 2px 3px rgba(0,0,0,.5), inset 0 0 0 1.5px rgba(160,140,255,.35); }
.nl-meter::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:calc(var(--fill,0)*100%); border-radius:8px; transition:width .25s ease-out; background:linear-gradient(180deg,#fff1a6,#ffc21a 55%,#ff8a00); box-shadow:0 0 10px rgba(255,190,40,.6), inset 0 2px 0 rgba(255,255,255,.6); }
.nl-meter [data-star]{ position:absolute; top:50%; width:22px; height:22px; transform:translate(-50%,-50%); z-index:2; background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36Z' fill='%23281a6a' stroke='%238f73ff' stroke-width='8' stroke-linejoin='round'/></svg>") center/contain no-repeat; transition:transform .3s var(--nl-spring); }
.nl-meter [data-star].on{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36Z' fill='%23ffd84a' stroke='%23fff3b0' stroke-width='6' stroke-linejoin='round'/></svg>"); transform:translate(-50%,-50%) scale(1.25); filter:drop-shadow(0 0 6px rgba(255,200,60,.9)); }
.nl-cordchip{ display:inline-flex; align-items:center; gap:2px; height:44px; padding:0 14px 0 4px; border-radius:16px; background:linear-gradient(180deg,#2a1a7a,#1a0f52); box-shadow:inset 0 0 0 2px rgba(160,140,255,.5), 0 4px 0 #0e0738; font-family:var(--nl-ui); font-weight:700; font-size:21px; color:#fff; }
.nl-cordchip img{ width:34px; height:34px; }
.nl-cordchip.low{ color:#ff8090; box-shadow:inset 0 0 0 2px var(--nl-red), 0 4px 0 #0e0738, 0 0 14px rgba(255,59,78,.5); animation:nl-throb .8s ease-in-out infinite; }
.nl-cordchip.refund{ animation:nl-gulp .45s var(--nl-spring); }
.nl-goaltray{ position:absolute; left:50%; top:66px; transform:translateX(-50%); display:flex; gap:8px; z-index:20; }
.nl-goal-mini{ position:relative; display:flex; align-items:center; gap:3px; padding:0 11px 0 4px; height:36px; border-radius:13px; background:rgba(20,10,60,.6); box-shadow:inset 0 0 0 2px rgba(160,140,255,.4); backdrop-filter:blur(6px); font-family:var(--nl-ui); font-weight:700; font-size:17px; color:#fff; }
.nl-goal-mini img{ width:28px; height:28px; object-fit:contain; }
.nl-goal-mini.done{ background:rgba(20,110,60,.7); box-shadow:inset 0 0 0 2px #5cf08f; color:#bfffd2; }
.nl-level-tag{ position:absolute; left:14px; bottom:16px; z-index:20; font-family:var(--nl-display); font-weight:600; font-size:13px; letter-spacing:.12em; text-transform:uppercase; line-height:1; color:var(--nl-text-soft); }
.nl-level-tag b{ display:block; font-size:30px; font-weight:700; letter-spacing:0; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.35); }

/* boosters along the bottom (rounded tiles with a count) */
.nl-boosters{ position:absolute; left:0; right:0; bottom:18px; display:flex; justify-content:center; gap:14px; z-index:20; }
.nl-booster{ position:relative; width:62px; height:62px; border-radius:18px; display:grid; place-items:center; cursor:pointer;
  background:linear-gradient(180deg,#8cf5a8,#3ad66e 45%,#16a04a); box-shadow:0 5px 0 #0a5a2a, 0 8px 14px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6), inset 0 0 0 3px rgba(255,255,255,.2); }
.nl-booster img{ width:40px; height:40px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
.nl-booster .nl-badge{ position:absolute; right:-6px; bottom:-6px; }
.nl-booster:active{ transform:translateY(4px); box-shadow:0 1px 0 #0a5a2a; }

/* hint text on the board */
.nl-board-note{ position:absolute; z-index:15; font-family:var(--nl-ui); font-weight:600; font-size:18px; line-height:1.25; color:#fff; text-align:center; pointer-events:none; text-shadow:0 2px 6px rgba(0,0,0,.6); }
.nl-board-note .ico{ display:inline-block; width:30px; height:30px; vertical-align:middle; margin-right:2px; }
.nl-board-arrow{ position:absolute; z-index:15; pointer-events:none; overflow:visible; }
.nl-board-arrow path{ fill:none; stroke:#fff; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }

/* ---------- FX text (fx.js) ------------------------------------------ */
.nl-fx-layer{ position:fixed; inset:0; pointer-events:none; z-index:9001; overflow:hidden; }
.nl-pop{ position:absolute; transform:translate(-50%,-50%); text-align:center; animation:nl-pop 1.3s cubic-bezier(.2,1.4,.4,1) both; white-space:nowrap; }
.nl-pop-num{ display:block; font-family:var(--nl-display); font-weight:700; font-size:38px; color:#fff36a; -webkit-text-stroke:6px #5a2a00; paint-order:stroke fill; text-shadow:0 3px 0 #5a2a00, 0 0 18px rgba(255,200,60,.85); }
.nl-pop.big .nl-pop-num{ font-size:54px; }
.nl-pop-label{ display:block; font-family:var(--nl-display); font-weight:700; font-size:20px; color:#fff; -webkit-text-stroke:5px #2a1260; paint-order:stroke fill; margin-bottom:-4px; }
.nl-pop.tint-0 .nl-pop-num{ color:#ffb0b8 } .nl-pop.tint-2 .nl-pop-num{ color:#c8ffd4 } .nl-pop.tint-3 .nl-pop-num{ color:#bfe2ff }
.nl-callout{ position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); text-align:center; animation:nl-callout 1.45s cubic-bezier(.2,1.3,.4,1) both; }
.nl-callout-text{ --g:linear-gradient(180deg,#fffbe0 0%,#ffe45a 38%,#ffb000 66%,#ff7a00 100%); position:relative; font-family:var(--nl-display); font-weight:700; font-size:56px; line-height:1.05; white-space:nowrap;
  color:#5a2200; -webkit-text-stroke:.2em #5a2200; paint-order:stroke fill; text-shadow:0 .1em 0 #5a2200, 0 .18em .3em rgba(0,0,0,.5); transform:rotate(-4deg); }
.nl-callout-text::after{ content:attr(data-text); position:absolute; left:0; top:0; right:0; -webkit-text-stroke:0; text-shadow:none; color:transparent; background:var(--g); -webkit-background-clip:text; background-clip:text; }

/* ---------- keyframes ------------------------------------------------- */
@keyframes nl-sweep{ 0%{background-position:160% 0} 60%,100%{background-position:-60% 0} }

@media (prefers-reduced-motion:reduce){ .nl-btn.shine::after,.nl-sunburst::before,.nl-medal::before,.nl-callout-rays,.nl-tile.current{animation:none} }

/* ---- studio-kit/screens.css v4, inlined last ---- */
/* =====================================================================
   XMAS LIGHTS  ·  screens.css  (team 2) · v3.1 "Night Glow"
   Reskins the OLD screens that still use the navy/serif look:
   Classic puzzles + Duel level list (#sLevels), level intro (#sIntro),
   result (#sResult), and the free-play / duel / classic HUD (#hud, #bar).
   Pure CSS overrides on the existing markup and class names, no JS.
   Load AFTER the game's own <style> blocks (inline it last at merge).
   Needs kit.css variables (--nl-*) and the Fredoka font.
   ===================================================================== */

/* the old frosted screens: indigo scrim instead of navy */
.screen:not(.kitscreen){ padding:24px 18px; background:radial-gradient(ellipse at 50% 38%,rgba(60,36,160,.35),rgba(12,6,40,.88)); }

/* cards -> violet glossy panel (same as .nl-card) */
.screen:not(.kitscreen) .card{
  font-family:var(--nl-ui); color:var(--nl-text,#fff); border:0; border-radius:var(--nl-r,28px);
  width:min(400px,100%); padding:26px 18px 22px; gap:12px;
  background:linear-gradient(180deg,var(--nl-panel-1) 0%,var(--nl-panel-2) 45%,var(--nl-panel-3) 100%);
  box-shadow:inset 0 0 0 3px var(--nl-panel-rim), inset 0 3px 0 4px rgba(255,255,255,.12), 0 0 0 4px var(--nl-panel-edge), 0 10px 0 4px var(--nl-panel-edge), 0 24px 50px rgba(0,0,0,.55);
  backdrop-filter:none; -webkit-backdrop-filter:none; }
#sLevels .card{ width:min(460px,100%) !important; }
.screen:not(.kitscreen) h2{ font-family:var(--nl-display); font-weight:700; font-size:32px; line-height:1.05; color:#fff; text-shadow:0 3px 0 rgba(20,8,70,.6); }
.screen:not(.kitscreen) h1{ font-family:var(--nl-display); }
.screen:not(.kitscreen) p{ font-family:var(--nl-ui); font-weight:500; color:#e6defc; font-size:16px; line-height:1.4; }
.screen:not(.kitscreen) .eyebrow{ font-family:var(--nl-ui); font-weight:700; letter-spacing:.12em; color:#ffd76a; font-size:13px; }
.screen:not(.kitscreen) .small{ color:#cfc6f5; font-size:14px; }

/* buttons: .btn = green glossy, .btn.sec = violet, .btn.big = large */
.screen:not(.kitscreen) .btn{
  --c1:var(--nl-green-lt); --c2:var(--nl-green); --c3:var(--nl-green-dk); --e:var(--nl-green-edge);
  position:relative; min-height:54px; padding:0 22px 4px; border:0; border-radius:18px;
  font-family:var(--nl-display); font-weight:700; font-size:21px; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.25);
  background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 45%,var(--c3) 100%);
  box-shadow:0 5px 0 var(--e), 0 10px 16px rgba(0,0,0,.35), inset 0 -4px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.6), inset 0 0 0 2px rgba(255,255,255,.18);
  transition:transform .08s, box-shadow .08s; }
.screen:not(.kitscreen) .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--e), 0 4px 8px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); }
.screen:not(.kitscreen) .btn.sec{ --c1:#8f78ff; --c2:#6a4ff0; --c3:#4a30c8; --e:#24127a; }
.screen:not(.kitscreen) .btn.big{ min-height:66px; font-size:30px; border-radius:22px; }
.screen:not(.kitscreen) .linkbtn{ font-family:var(--nl-ui); font-weight:600; color:#d9d2ff; }

/* segmented tabs */
.screen:not(.kitscreen) .seg{ background:rgba(10,4,40,.4); border-radius:14px; padding:4px; gap:4px; box-shadow:inset 0 0 0 2px rgba(160,140,255,.25); }
.screen:not(.kitscreen) .seg button{ font-family:var(--nl-ui); font-weight:600; font-size:15px; color:#d9d2ff; border-radius:11px; padding:8px 14px; }
.screen:not(.kitscreen) .seg button[aria-pressed="true"]{ background:linear-gradient(180deg,#fff0a0,#ffc21a 55%,#f08a00); color:#4a2200; box-shadow:0 3px 0 #8a4a00; }

/* level tiles (Classic puzzles / Duel campaign) -> same tiles as the journey map */
#lvGrid.grid{ grid-template-columns:repeat(3,1fr); gap:12px; }
.screen:not(.kitscreen) .lv{
  border:0; border-radius:18px; padding:10px 4px 8px; gap:2px; color:#fff; font-family:var(--nl-ui);
  background:linear-gradient(180deg,#7d63ff,#5a3df0 50%,#3e24c4);
  box-shadow:0 5px 0 #1d0f6e, 0 8px 12px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.45), inset 0 0 0 2px rgba(255,255,255,.12); }
.screen:not(.kitscreen) .lv b{ font-family:var(--nl-display); font-weight:700; font-size:28px; line-height:1; text-shadow:0 2px 0 rgba(0,0,0,.3); }
.screen:not(.kitscreen) .lv small{ font-size:12px; font-weight:600; color:#ece6ff; }
.screen:not(.kitscreen) .lv .st{ font-size:15px; letter-spacing:1px; color:rgba(20,8,70,.55); }
.screen:not(.kitscreen) .lv .st .on{ color:#ffd21a; text-shadow:0 0 8px rgba(255,200,40,.8), 0 1px 0 #8a4a00; }
.screen:not(.kitscreen) .lv:disabled{ opacity:1; background:linear-gradient(180deg,#2c2070,#20175a); box-shadow:0 5px 0 #0e0738, inset 0 0 0 2px rgba(140,120,255,.2); }
.screen:not(.kitscreen) .lv:disabled b,.screen:not(.kitscreen) .lv:disabled small{ color:#7f70c8; text-shadow:none; }
.screen:not(.kitscreen) .lv:not(:disabled):active{ transform:translateY(4px); box-shadow:0 1px 0 #1d0f6e; }

/* intro chips + result stars */
.screen:not(.kitscreen) .chip{ font-family:var(--nl-ui); font-weight:600; font-size:14px; color:#fff; background:rgba(20,10,60,.55); box-shadow:inset 0 0 0 2px rgba(160,140,255,.4); padding:5px 12px; border-radius:14px; }

<script>
(()=>{

const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---------- storage ----------

let musicOn=store.get('music',true);
let progress=store.get('progress',{duel:{},puzzle:{}});

// ---------- levels ----------
// Positions are 0..1 across the board. "h" holds hazards.
const DUEL=[
 {name:'First Light',desc:'Drag a cord from one bulb to another. Close all three sides of a triangle and it lights up for whoever drew the last cord.',b:[[.5,.2],[.18,.75],[.82,.75]],h:{}},
 {name:'The Bow',desc:'Watch what you leave behind. Two sides of a triangle are an open invitation for Frost. Half of the opening cords here win, half only tie.',b:[[.2,.22],[.8,.22],[.5,.5],[.2,.8],[.8,.8]],h:{}},
 {name:'Chain Reaction',desc:'Light a triangle and you draw again. Set things up so one cord lets you light the next, and the next.',b:[[.5,.5],[.5,.16],[.79,.33],[.79,.67],[.5,.84],[.21,.67],[.21,.33]],h:{}},
 {name:'The Big Window',desc:'More bulbs, more choices. A long cord blocks every cord that would cross it, so think before you stretch.',b:[[.18,.18],[.5,.12],[.84,.24],[.36,.46],[.66,.5],[.14,.74],[.5,.84],[.86,.78]],h:{}},
 {name:'Candle Clock',desc:'Your candle burns for 10 seconds each turn. If it goes out, you lose the turn and a point.',b:[[.5,.12],[.2,.32],[.8,.32],[.5,.48],[.24,.76],[.76,.76],[.5,.9]],h:{candle:10}},
 {name:'Yard Clutter',desc:'Candy canes, mittens, snowmen and Santa\'s hat keep turning up in the yard. Cords can\'t pass them, and after a few turns they pop away and land somewhere new.',b:[[.15,.2],[.45,.14],[.82,.18],[.3,.5],[.7,.44],[.14,.82],[.52,.78],[.86,.72]],h:{drifts:{count:2,ttl:4}}},
 {name:'Burnt Out',desc:'Bulbs with no cord can burn out. Plug in the ones you need early.',b:[[.15,.15],[.5,.12],[.85,.16],[.3,.38],[.7,.36],[.12,.6],[.5,.56],[.88,.62],[.32,.86],[.72,.84]],h:{burnout:{count:3,after:3}}},
 {name:'Unwrap',desc:'Light a triangle around the present to unwrap it. If Frost unwraps it first, you lose.',b:[[.5,.14],[.82,.32],[.82,.7],[.5,.88],[.18,.7],[.18,.32],[.5,.32]],h:{gifts:[[.5,.6]],giftRule:'one'}},
 {name:'Snow Globe',desc:'Someone keeps shaking the snow globe. The yard flips over, but every cord stays connected.',b:[[.2,.16],[.6,.12],[.86,.36],[.42,.4],[.18,.6],[.66,.62],[.34,.86],[.8,.84]],h:{shake:[5,10]}},
 {name:'Fresh Bulbs',desc:'New bulbs drop into the snow as you play. A bulb inside a triangle stops it from lighting.',b:[[.16,.2],[.5,.16],[.84,.22],[.24,.62],[.6,.5],[.84,.7],[.44,.86]],h:{spawn:[2,6,9]}},
 {name:'Reindeer Crossing',desc:'A sleigh races across the yard and snaps any cord in its path. Lit points stay yours.',b:[[.5,.12],[.18,.3],[.82,.3],[.36,.56],[.66,.56],[.16,.84],[.84,.84]],h:{sleigh:[3,7]}},
 {name:'Before Midnight',desc:'Finish the board ahead of Frost before the clock strikes midnight. Being ahead when time runs out is not enough.',b:[[.14,.2],[.48,.12],[.84,.2],[.3,.44],[.68,.42],[.16,.76],[.5,.66],[.84,.78]],h:{midnight:55}},
 {name:'Avalanche',desc:'After five cords, the roof sheds its snow and buries every cord. Light what you can before it slides.',b:[[.2,.16],[.58,.14],[.86,.3],[.36,.42],[.64,.5],[.14,.62],[.44,.82],[.82,.8]],h:{avalanche:5}},
 {name:'Stocking Stuffers',desc:'Three presents in the snow. Unwrap more of them than Frost, and finish ahead.',b:[[.14,.16],[.5,.1],[.86,.16],[.3,.46],[.7,.46],[.12,.8],[.5,.88],[.88,.8]],h:{gifts:[[.5,.32],[.3,.72],[.72,.7]],giftRule:'most'}},
 {name:'Star on Top',desc:'The tree star lights last: it joins once nothing else can be connected. Frost also gets one sneaky double move.',b:[[.18,.2],[.82,.2],[.3,.52],[.7,.52],[.14,.84],[.5,.72],[.86,.84],[.5,.92]],h:{topper:[.5,.34],elf:5}}
];
// Puzzles: solo. Unwrap every present within the cord budget. "e" are cords already in the snow.
const PUZ=[
 {name:'Wrapped Up',desc:'Solo puzzle. Unwrap the present by lighting a triangle around it. Use as few cords as you can.',b:[[.5,.18],[.16,.78],[.84,.78],[.5,.6]],e:[],gifts:[[.42,.47]],par:3},
 {name:'Halfway There',desc:'Two cords are already laid. Finish what they started.',b:[[.2,.2],[.8,.2],[.5,.82],[.5,.45],[.2,.62],[.8,.62]],e:[[2,4]],gifts:[[.5,.68]],par:2},
 {name:'In the Way',desc:'A bulb inside a triangle stops it from lighting. Find the triangle that holds the present and nothing else.',b:[[.5,.1],[.12,.6],[.88,.6],[.5,.5],[.5,.9],[.3,.32]],e:[],gifts:[[.6,.34]],par:3},
 {name:'Two Birds',desc:'Two presents. One cord can light two triangles at once.',b:[[.5,.12],[.5,.88],[.14,.5],[.86,.5]],e:[[0,2],[2,1],[0,3],[3,1]],gifts:[[.3,.5],[.7,.5]],par:1},
 {name:'Crossed Wires',desc:'Cords can never cross. Pick your long cords carefully.',b:[[.15,.15],[.85,.15],[.85,.85],[.15,.85],[.5,.5],[.5,.15]],e:[[4,0]],gifts:[[.7,.55],[.3,.62]],par:5},
 {name:'Candy Cane Lane',desc:'This candy cane is not going anywhere. Route your cords around it.',b:[[.12,.2],[.88,.2],[.5,.88],[.5,.14],[.3,.6],[.7,.6]],e:[],gifts:[[.5,.44]],drifts:[[.43,.36,58]],par:3},
 {name:'Star Gazer',desc:'Three presents around a tree star. The star is an obstacle that never lights.',b:[[.5,.08],[.12,.7],[.88,.7],[.5,.92],[.3,.4],[.7,.4]],e:[[4,5]],gifts:[[.5,.28],[.3,.75],[.7,.75]],topper:[.5,.6],par:5}
];

// ---------- audio ----------
let AC=null, master=null, noiseBuf=null, wind=null;
let fxBus=null, limIn=null, outGain=null;
let sfxVoices=0, lastPtSnd=0; const SFX_MAX_VOICES=48, OUTV=1;
// surface sounds follow the finger (or Frost) across the stereo field: the tingle of a sound moving ear to ear
function fxPan(sx){if(!AC||!fxBus||!fxBus.pan)return;fxBus.pan.setTargetAtTime(clamp((sx/SW-.5)*1.5,-.75,.75),AC.currentTime,.04)}
function initAudio(){
  if(AC) {if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=.8;
    fxBus=AC.createStereoPanner?AC.createStereoPanner():AC.createGain();fxBus.connect(master);
    const comp=AC.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3; comp.attack.value=.012; comp.release.value=.25;
    // safety stage: one shared output with a soft clip that is clean below 0.7 and rounds off above it, so piles of sounds can't hard-clip
    limIn=AC.createGain(); const sc=AC.createWaveShaper(); {const n=4096,c=new Float32Array(n),K=.7;for(let i=0;i<n;i++){const x=(i/(n-1)*2-1)*1.6,a=Math.abs(x);c[i]=Math.sign(x)*(a<=K?a:K+(.98-K)*Math.tanh((a-K)/(.98-K)))}sc.curve=c;sc.oversample='4x'}
    outGain=AC.createGain(); outGain.gain.value=muted?0:OUTV; const pre=AC.createGain(); pre.gain.value=1/1.6; limIn.connect(outGain); outGain.connect(pre); pre.connect(sc); sc.connect(AC.destination);
    // gentle room reverb
    const conv=AC.createConvolver(); const len=AC.sampleRate*2.2; const ir=AC.createBuffer(2,len,AC.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
    conv.buffer=ir; const wet=AC.createGain(); wet.gain.value=.28;
    master.connect(comp); master.connect(conv); conv.connect(wet); wet.connect(comp); comp.connect(limIn);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const nd=noiseBuf.getChannelData(0); for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    // wind bed
    const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380; lp.Q.value=.4;
    const g=AC.createGain(); g.gain.value=.035;
    const lfo=AC.createOscillator(); lfo.frequency.value=.07; const lg=AC.createGain(); lg.gain.value=.02; lfo.connect(lg); lg.connect(g.gain);
    src.connect(lp); lp.connect(g); g.connect(master); src.start(); lfo.start(); wind=g;
    musicBus=AC.createGain(); musicBus.gain.value=musicOn?.55:0; musicBus.connect(master); startMusic(); setAmbience();
    if(window.NLSfx&&NLSfx.init){try{NLSfx.init(AC,limIn);NLSfx.__ready=1}catch(e){}}
  }catch(e){AC=null}
}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec)}
function osc(type,f,t,a,peak,dec,dest){if(!dest&&sfxVoices>=SFX_MAX_VOICES)return {frequency:{exponentialRampToValueAtTime(){},setValueAtTime(){},linearRampToValueAtTime(){}},detune:{value:0}};const o=AC.createOscillator(),g=AC.createGain();if(!dest){sfxVoices++;o.onended=()=>{sfxVoices--}}o.type=type;o.frequency.setValueAtTime(f,t);o.connect(g);g.connect(dest||master);env(g,t,a,peak,dec);o.start(t);o.stop(t+a+dec+.05);return o}
function noise(t,dur,type,f,q,peak,dest){if(!dest&&sfxVoices>=SFX_MAX_VOICES)return {frequency:{value:0,exponentialRampToValueAtTime(){},setValueAtTime(){}},Q:{value:0}};const s=AC.createBufferSource();if(!dest){sfxVoices++;s.onended=()=>{sfxVoices--}}s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();s.connect(fl);fl.connect(g);g.connect(dest||master);env(g,t,.004,peak,dur);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);return fl}
const SFX={
  bell(freq,vol=1,delay=0){if(!AC)return;const t=AC.currentTime+delay;[[1,.22,1.6],[2.01,.08,1.1],[2.76,.06,.8],[5.4,.03,.45],[8.93,.015,.25]].forEach(([m,p,d])=>osc('sine',freq*m,t,.004,p*vol,d))},
  pluck(){if(!AC)return;const t=AC.currentTime;osc('triangle',196,t,.003,.12,.18);noise(t,.04,'bandpass',2400,1.2,.05)},
  crunch(v=1){if(!AC)return;const t=AC.currentTime;noise(t,.05+Math.random()*.04,'bandpass',rnd(1400,3400),.9,.05*v);if(Math.random()<.5)noise(t+.02,.03,'highpass',5000,.7,.025*v)},
  click(){if(!AC)return;const t=AC.currentTime;osc('sine',1320,t,.002,.09,.06);osc('sine',660,t,.002,.06,.1);const o=osc('sine',120,t,.004,.18,.22);o.frequency.exponentialRampToValueAtTime(60,t+.2);noise(t,.08,'lowpass',900,.6,.12)},
  thud(){if(!AC)return;const t=AC.currentTime;const o=osc('sine',110,t,.004,.2,.25);o.frequency.exponentialRampToValueAtTime(45,t+.22);noise(t,.12,'lowpass',500,.5,.12)},
  pop(){if(!AC)return;const t=AC.currentTime;noise(t,.09,'highpass',2500,.8,.2);osc('square',1800,t,.001,.04,.05);[0,.04,.09].forEach(d=>osc('sine',rnd(3000,5000),t+d+.03,.001,.03,.08))},
  buzz(dur){if(!AC)return;const t=AC.currentTime;const o=osc('sawtooth',58,t,.02,.03,dur);},

  for(const m of moves){const s=trisFor(M,m[0],m[1]).length;if(s>0)scored.push([m,s]);else if(isSafe(M,m[0],m[1]))safe.push(m);else risky.push(m)}
  if(diff==='easy'){

  }
  if(scored.length){scored.sort((x,y)=>y[1]-x[1]);const top=scored.filter(s=>s[1]===scored[0][1]);return pick(top)[0]}
  if(safe.length){if(diff==='hard'&&safe.length<=9){const m=parityPick(M,safe);if(m)return m}return pick(safe)}
  let best=[],bv=1e9;

}

function ekey(a,b){return a<b?a*1000+b:b*1000+a}

}

// commit a cord; returns triangles lit

}

const BLOCKERS=[['cane','A candy cane'],['hat',"Santa's hat"],['snowman','A snowman'],['ginger','A gingerbread man'],['rock','A snowy rock'],['mitten','A lost mitten']];
function newBlocker(x,y,r,ttl,kind){const k=kind?BLOCKERS.find(b=>b[0]===kind):pick(BLOCKERS);return {x,y,r,ttl,born:now(),melt:0,kind:k[0],name:k[1],rot:rnd(-.5,.5),wob:0}}
function spawnDrift(){

// ---------- turn flow ----------

function isPuzzle(){return G&&G.mode==='puzzle'}
async function startTurn(who){
  const g=G;if(!g||g.over)return;
  if(g.mode==='journey'){g.turn='you';g.busy=false;updateHUD();if(jStuck(g))return jFail();return jTurn()}
  if(g.turn!==who)g.turnScore=0;
  g.turn=who;g.busy=false;
  if(!anyMove(g.M)){
    if(g.bulbs.some(b=>b.kind==='topper'&&b.locked)&&!isPuzzle()){g.busy=true;await unlockTopper();if(g!==G)return;g.busy=false}
    if(!anyMove(g.M))return endGame();
  }
  if(isPuzzle()){updateHUD();return}
  if(who==='you'){g.candle=g.h.candle||0;updateHUD();if(g.drawn===0&&g.mode!=='free'&&g.idx===0)hint('Drag from a bulb to another bulb.');else hint(g.turnScore>0?'Another cord! Keep the chain going.':'Your move.')}
  else{updateHUD();hint('Frost is thinking...');aiTurn()}
}
async function aiTurn(){
  const g=G;g.busy=true;
  await wait(difficulty==='easy'?700:550+Math.random()*350);if(g!==G||g.over)return;
  const m=aiChoose(g.M,difficulty);if(!m){return startTurn('ai')}
  let [a,b]=m;if(Math.random()<.5)[a,b]=[b,a];
  const rope=await animateDraw(a,b);if(g!==G||g.over)return;
  const n=commit(a,b,'ai',rope);
  await afterMove('ai',n);
}
function animateDraw(a,b){
  return new Promise(res=>{const A=G.bulbs[a],B=G.bulbs[b];const [ax,ay]=sock(A);const rope=new Rope(ax,ay,ax,ay+1,1.12);rope.n=clamp(Math.round(Math.hypot(B.x-A.x,B.y-A.y)/34),5,24);
    rope.x=[];rope.y=[];rope.px=[];rope.py=[];rope.lit=[];for(let i=0;i<=rope.n;i++){rope.x.push(ax);rope.y.push(ay);rope.px.push(ax);rope.py.push(ay);rope.lit.push(0)}

    if(AC){snowStart();cordStart()}
    G.aiDraw={a,b,rope,t0:now(),dur:clamp(520+L0*1.1,700,1300),sound:1,lx:null,ly:null,lt:now(),spd:0,done:()=>{G.aiDraw=null;if(AC){snowStop();cordStop()}lastWipe=null;res(rope)}};
  });

async function afterMove(who,scored){

  await runHazards();if(g!==G||g.over)return;
  if(isPuzzle()){
    g.history.push(1);
    if(g.gifts.every(x=>x.owner)){await wait(500);return endGame()}
    if(g.cordsUsed>=g.def.par+2){await wait(400);return endGame('Out of cords.')}
    return startTurn('you');
  }
  if(g.h.giftRule==='one'&&g.giftsWon.you>0&&false){}
  if(scored>0&&anyMove(g.M)){return startTurn(who)}

  if(who==='ai'&&!g.elfDone&&g.drawn>=g.h.elf){g.elfDone=true;floats.push({x:W/2,y:W/2,text:'A sneaky elf gives Frost an extra cord!',t0:now(),c:ICE,big:1});SFX.jingle(.6);await wait(900);if(g!==G)return;g.turnScore=0;return startTurn('ai')}

}
async function timeOut(){
  const g=G;if(g.busy||g.over)return;g.busy=true;g.drag=null;g.sel=null;snowStop();cordStop();buzzStop();
  g.score.you=Math.max(0,g.score.you-1);SFX.thud();floats.push({x:W/2,y:W/2,text:'The candle went out. -1',t0:now(),c:[255,160,120],big:1});updateHUD();
  await wait(900);if(g!==G)return;await endOfTurnUpkeep();if(g!==G)return;startTurn('ai');
}
function endGame(reason){
  const g=G;if(g.over)return;g.over=true;g.busy=true;g.drag=null;snowStop();cordStop();buzzStop();updateHUD();
  let win,stars=0,crit=[];
  if(isPuzzle()){
    win=g.gifts.every(x=>x.owner);const used=g.cordsUsed,par=g.def.par;
    stars=win?(used<=par?3:used<=par+1?2:1):0;
    crit=[[win,'Unwrap every present'],[win&&used<=par+1,`Use ${par+1} cords or fewer`],[win&&used<=par,`Use ${par} cords (par)`]];
    showResult(win,stars,crit,win?`Solved with ${used} cord${used===1?'':'s'}.`:(reason||'No moves left.'),g);

  }
  if(g.mode==='free'){showResult(true,0,[],`You lit ${g.score.you} triangle${g.score.you===1?'':'s'}. The whole street is impressed.`,g);return}
  const you=g.score.you,ai=g.score.ai;

  win=!reason&&you>ai&&giftOk;
  if(win){stars=1+(you-ai>=2?1:0)+(g.bestCombo>=2?1:0)}
  crit=[[win,'Finish ahead of Frost'],[win&&you-ai>=2,'Win by 2 or more'],[win&&g.bestCombo>=2,'Light 2+ triangles in one turn']];
  let text;
  if(reason)text=reason;else if(you>ai&&!giftOk)text=rule==='most'?'You led on points, but Frost unwrapped as many presents.':'You led on points, but the presents decide this one.';
  else if(you===ai)text=`An even glow, ${you} to ${ai}. A tie doesn't open the next level.`;else text=win?`You lit ${you} triangle${you===1?'':'s'} to Frost's ${ai}.`:`Frost lit ${ai} to your ${you}.`;
  showResult(win,stars,crit,text,g);
}
function showResult(win,stars,crit,text,g){

}
